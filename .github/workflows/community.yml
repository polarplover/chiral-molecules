name: Update game leaderboard

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'community/**'
      - 'site-config.js'
      - '.github/workflows/community.yml'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: game-community-snapshot
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - name: Read trusted source from main
        # actions/checkout v6, official tag resolved 2026-09-09.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v6, official tag resolved 2026-09-09.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check parsers and ranking
        run: node --test community/*.test.mjs
      - name: Rebuild the shared snapshot
        # Issue bodies are read as JSON through the API. They never enter shell source.
        run: node community/sync.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
